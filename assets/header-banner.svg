<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.25"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="cardClip">
      <rect width="900" height="200" rx="16"/>
    </clipPath>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes moveWave1 {
        0% { transform: translateX(0); }
        100% { transform: translateX(-900px); }
      }
      @keyframes moveWave2 {
        0% { transform: translateX(-900px); }
        100% { transform: translateX(0); }
      }
      @keyframes moveWave3 {
        0% { transform: translateX(0); }
        100% { transform: translateX(-900px); }
      }
      .wave-layer-1 {
        animation: moveWave1 12s linear infinite;
      }
      .wave-layer-2 {
        animation: moveWave2 18s linear infinite;
      }
      .wave-layer-3 {
        animation: moveWave3 8s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background Base -->
    <rect width="900" height="200" fill="url(#bannerBg)"/>
    <rect width="900" height="200" fill="url(#glowLeft)"/>
    <rect width="900" height="200" fill="url(#glowRight)"/>

    <!-- Moving Waves Layers (seamless repeating 1800px width path) -->
    <!-- Wave Layer 2 (Back / Slow) -->
    <g class="wave-layer-2">
      <path d="M0,175 C200,155 350,195 550,170 C720,145 820,185 900,175 C1100,155 1250,195 1450,170 C1620,145 1720,185 1800,175 L1800,200 L0,200 Z" fill="url(#waveGrad2)"/>
    </g>

    <!-- Wave Layer 1 (Middle) -->
    <g class="wave-layer-1">
      <path d="M0,165 C150,135 280,195 450,160 C620,130 750,185 900,165 C1050,135 1180,195 1350,160 C1520,130 1650,185 1800,165 L1800,200 L0,200 Z" fill="url(#waveGrad1)"/>
    </g>

    <!-- Wave Layer 3 (Front / Ambient Glow Accent) -->
    <g class="wave-layer-3">
      <path d="M0,185 C220,170 380,195 580,178 C760,165 840,190 900,185 C1120,170 1280,195 1480,178 C1660,165 1740,190 1800,185 L1800,200 L0,200 Z" fill="#38BDF8" fill-opacity="0.18"/>
    </g>

    <!-- Glowing Border -->
    <rect width="896" height="196" x="2" y="2" rx="14" fill="none" stroke="url(#textGrad)" stroke-width="1.2" stroke-opacity="0.45"/>

    <!-- Centered Hero Typography -->
    <g text-anchor="middle" filter="url(#shadow)">
      <!-- Subtitle Pill / Badge -->
      <rect x="340" y="24" width="220" height="26" rx="13" fill="#1f293d" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="450" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5">
        FELLOW DEVELOPER
      </text>

      <!-- Main Title -->
      <text x="450" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="3">
        AARSH MISHRA
      </text>

      <!-- Descriptor / Specialties -->
      <text x="450" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="13" font-weight="500" fill="#94A3B8" letter-spacing="1">
        Backend Microservices &#8226; Cross-Platform Systems &#8226; Open-Source Creator
      </text>
    </g>
  </g>
</svg>
