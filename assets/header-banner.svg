<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Oceanic Aqua & Electric Indigo Wave Gradients -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#3A7BD5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#2A52BE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00C9FF" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="wave3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="cardClip">
      <rect width="900" height="200" rx="16"/>
    </clipPath>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background Base -->
    <rect width="900" height="200" fill="url(#bannerBg)"/>
    <rect width="900" height="200" fill="url(#glowLeft)"/>
    <rect width="900" height="200" fill="url(#glowRight)"/>

    <!-- Wave 3 (Deepest / Slow Tide - 22s period) -->
    <g>
      <path d="M 0,162 C 150,142 300,182 450,162 C 600,142 750,182 900,162 C 1050,142 1200,182 1350,162 C 1500,142 1650,182 1800,162 L 1800,200 L 0,200 Z" fill="url(#wave3Grad)">
        <animateTransform
          attributeName="transform"
          type="translate"
          from="0,0"
          to="-900,0"
          dur="24s"
          repeatCount="indefinite" />
      </path>
    </g>

    <!-- Wave 2 (Middle Swell - 16s period) -->
    <g>
      <path d="M 0,170 C 120,150 240,190 450,168 C 660,146 780,186 900,170 C 1020,150 1140,190 1350,168 C 1560,146 1680,186 1800,170 L 1800,200 L 0,200 Z" fill="url(#wave2Grad)">
        <animateTransform
          attributeName="transform"
          type="translate"
          from="-900,0"
          to="0,0"
          dur="18s"
          repeatCount="indefinite" />
      </path>
    </g>

    <!-- Wave 1 (Foreground Water Crest - 12s period) -->
    <g>
      <path d="M 0,176 C 150,158 300,194 450,176 C 600,158 750,194 900,176 C 1050,158 1200,194 1350,176 C 1500,158 1650,194 1800,176 L 1800,200 L 0,200 Z" fill="url(#wave1Grad)">
        <animateTransform
          attributeName="transform"
          type="translate"
          from="0,0"
          to="-900,0"
          dur="13s"
          repeatCount="indefinite" />
      </path>
    </g>

    <!-- Ambient Top Water Surface Highlight -->
    <g>
      <path d="M 0,182 C 225,170 225,194 450,182 C 675,170 675,194 900,182 C 1125,170 1125,194 1350,182 C 1575,170 1575,194 1800,182 L 1800,200 L 0,200 Z" fill="#00FFFF" opacity="0.15">
        <animateTransform
          attributeName="transform"
          type="translate"
          from="-900,0"
          to="0,0"
          dur="10s"
          repeatCount="indefinite" />
      </path>
    </g>

    <!-- Glowing Border -->
    <rect width="896" height="196" x="2" y="2" rx="14" fill="none" stroke="url(#textGrad)" stroke-width="1.2" stroke-opacity="0.45"/>

    <!-- Centered Hero Typography -->
    <g text-anchor="middle" filter="url(#shadow)">
      <!-- Subtitle Pill / Badge -->
      <rect x="340" y="24" width="220" height="26" rx="13" fill="#1f293d" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="450" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5">
        FELLOW DEVELOPER
      </text>

      <!-- Main Title -->
      <text x="450" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="3">
        AARSH MISHRA
      </text>

      <!-- Descriptor / Specialties -->
      <text x="450" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="13" font-weight="500" fill="#94A3B8" letter-spacing="1">
        Backend Microservices &#8226; Cloud &amp; DevOps &#8226; AI &amp; Agent Systems
      </text>
    </g>
  </g>
</svg>
