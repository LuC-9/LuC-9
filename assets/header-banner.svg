<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="200" rx="16" fill="url(#bannerBg)"/>
  <rect width="900" height="200" rx="16" fill="url(#glowLeft)"/>
  <rect width="900" height="200" rx="16" fill="url(#glowRight)"/>
  <rect width="896" height="196" x="2" y="2" rx="14" fill="none" stroke="url(#textGrad)" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Flowing Waves at the bottom -->
  <path d="M0,170 C150,140 280,195 450,165 C620,135 750,185 900,160 L900,200 L0,200 Z" fill="url(#waveGrad)"/>
  <path d="M0,180 C200,160 350,195 550,175 C720,155 820,190 900,175 L900,200 L0,200 Z" fill="#38BDF8" fill-opacity="0.15"/>

  <!-- Centered Hero Typography -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Subtitle Pill / Badge -->
    <rect x="310" y="25" width="280" height="26" rx="13" fill="#1f293d" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
    <text x="450" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5">
      SENIOR PLATFORM &amp; SYSTEMS ENGINEER
    </text>

    <!-- Main Title -->
    <text x="450" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="3">
      AARSH MISHRA
    </text>

    <!-- Descriptor / Specialties -->
    <text x="450" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="13" font-weight="500" fill="#94A3B8" letter-spacing="1">
      Cloud-Native Architecture &#8226; Kubernetes &amp; GitOps &#8226; Desktop Systems
    </text>
  </g>
</svg>
