<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.25"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="cardClip">
      <rect width="900" height="200" rx="16"/>
    </clipPath>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background Base -->
    <rect width="900" height="200" fill="url(#bannerBg)"/>
    <rect width="900" height="200" fill="url(#glowLeft)"/>
    <rect width="900" height="200" fill="url(#glowRight)"/>

    <!-- SMIL Moving/Undulating Waves -->
    <!-- Wave Layer 2 (Back) -->
    <path fill="url(#waveGrad2)">
      <animate
        attributeName="d"
        dur="12s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        values="
          M0 200 L0 150 Q225 185 450 155 T900 170 L900 200 Z;
          M0 200 L0 170 Q225 135 450 175 T900 145 L900 200 Z;
          M0 200 L0 140 Q225 170 450 145 T900 180 L900 200 Z;
          M0 200 L0 150 Q225 185 450 155 T900 170 L900 200 Z" />
    </path>

    <!-- Wave Layer 1 (Front Main) -->
    <path fill="url(#waveGrad1)">
      <animate
        attributeName="d"
        dur="8s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        values="
          M0 200 L0 165 Q225 130 450 165 T900 150 L900 200 Z;
          M0 200 L0 145 Q225 180 450 140 T900 175 L900 200 Z;
          M0 200 L0 175 Q225 145 450 170 T900 140 L900 200 Z;
          M0 200 L0 165 Q225 130 450 165 T900 150 L900 200 Z" />
    </path>

    <!-- Wave Layer 3 (Accent Crest) -->
    <path fill="#38BDF8" opacity="0.25">
      <animate
        attributeName="d"
        dur="6s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        values="
          M0 200 L0 180 Q225 160 450 180 T900 165 L900 200 Z;
          M0 200 L0 168 Q225 190 450 165 T900 182 L900 200 Z;
          M0 200 L0 185 Q225 162 450 188 T900 160 L900 200 Z;
          M0 200 L0 180 Q225 160 450 180 T900 165 L900 200 Z" />
    </path>

    <!-- Glowing Border -->
    <rect width="896" height="196" x="2" y="2" rx="14" fill="none" stroke="url(#textGrad)" stroke-width="1.2" stroke-opacity="0.45"/>

    <!-- Centered Hero Typography -->
    <g text-anchor="middle" filter="url(#shadow)">
      <!-- Subtitle Pill / Badge -->
      <rect x="340" y="24" width="220" height="26" rx="13" fill="#1f293d" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="450" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5">
        FELLOW DEVELOPER
      </text>

      <!-- Main Title -->
      <text x="450" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="3">
        AARSH MISHRA
      </text>

      <!-- Descriptor / Specialties -->
      <text x="450" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="13" font-weight="500" fill="#94A3B8" letter-spacing="1">
        Backend Microservices &#8226; Cloud &amp; DevOps &#8226; AI &amp; Agent Systems
      </text>
    </g>
  </g>
</svg>
