<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="footerWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="footerWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.25"/>
    </linearGradient>

    <clipPath id="footerClip">
      <rect width="900" height="80" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect width="900" height="80" fill="url(#footerBg)"/>

    <!-- SMIL Moving/Undulating Waves -->
    <!-- Wave Layer 2 (Back) -->
    <path fill="url(#footerWave2)">
      <animate
        attributeName="d"
        dur="10s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        values="
          M0 80 L0 30 Q225 60 450 35 T900 50 L900 80 Z;
          M0 80 L0 45 Q225 20 450 50 T900 25 L900 80 Z;
          M0 80 L0 25 Q225 50 450 25 T900 55 L900 80 Z;
          M0 80 L0 30 Q225 60 450 35 T900 50 L900 80 Z" />
    </path>

    <!-- Wave Layer 1 (Front) -->
    <path fill="url(#footerWave1)">
      <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
        values="
          M0 80 L0 45 Q225 15 450 45 T900 30 L900 80 Z;
          M0 80 L0 25 Q225 55 450 20 T900 50 L900 80 Z;
          M0 80 L0 50 Q225 30 450 48 T900 20 L900 80 Z;
          M0 80 L0 45 Q225 15 450 45 T900 30 L900 80 Z" />
    </path>
  </g>
</svg>
